<!DOCTYPE html>
<html>

<head>

<title>MUT Threat Intelligence Dashboard</title>

<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

<style>

body{
font-family:Arial;
background:#f3e9e5;
margin:0;
padding:30px;
}

h1{
text-align:center;
color:#c08081;
margin-bottom:30px;
}

/* Stats cards */

.container{
display:flex;
justify-content:center;
gap:20px;
margin-bottom:40px;
}

.card{

background:white;
border-left:6px solid #c08081;
padding:20px;
width:220px;
border-radius:8px;
box-shadow:0 4px 8px rgba(0,0,0,0.1);
font-size:18px;

}

/* Main layout */

.dashboard{
display:flex;
gap:40px;
}

/* Left section */

.left{
flex:1;
background:white;
padding:20px;
border-radius:8px;
box-shadow:0 4px 8px rgba(0,0,0,0.1);
}

/* Right section */

.right{
flex:1.5;
background:white;
padding:20px;
border-radius:8px;
box-shadow:0 4px 8px rgba(0,0,0,0.1);
}

/* Table */

table{
width:100%;
border-collapse:collapse;
margin-top:10px;
}

th{

background:#c08081;
color:white;
padding:10px;
text-align:left;

}

td{
padding:10px;
border-bottom:1px solid #eee;
}

/* Prevent long URLs from breaking layout */

.urlCell{
max-width:400px;
word-break:break-all;
}

/* Verdict styles */

.safe{
color:green;
font-weight:bold;
}

.suspicious{
color:#e67e22;
font-weight:bold;
}

.highrisk{
color:red;
font-weight:bold;
}

</style>

</head>


<body>

<h1>MUT Threat Intelligence Dashboard</h1>


<div class="container">

<div class="card" id="total">Loading...</div>
<div class="card" id="highrisk">Loading...</div>
<div class="card" id="suspicious">Loading...</div>
<div class="card" id="safe">Loading...</div>

</div>



<div class="dashboard">

<div class="left">

<h2 style="color:#c08081">Risk Distribution</h2>

<canvas id="riskChart"></canvas>

</div>


<div class="right">

<h2 style="color:#c08081">Recent URL Scans</h2>

<table>

<thead>

<tr>

<th>URL</th>
<th>Verdict</th>

</tr>

</thead>

<tbody id="recentTable">

</tbody>

</table>

</div>

</div>



<script>

/* Fetch Stats */

fetch("http://localhost:5000/api/dashboard/stats")

.then(res=>res.json())

.then(data=>{

document.getElementById("total").innerText =
"Total URLs Scanned: "+data.totalScans;

document.getElementById("highrisk").innerText =
"High Risk: "+data.highRisk;

document.getElementById("suspicious").innerText =
"Suspicious: "+data.suspicious;

document.getElementById("safe").innerText =
"Safe: "+data.safe;


const table=document.getElementById("recentTable");

data.recentScans.forEach(scan=>{

const row=document.createElement("tr");

const urlCell=document.createElement("td");
urlCell.className="urlCell";
urlCell.innerText=scan.url;

const verdictCell=document.createElement("td");
verdictCell.innerText=scan.verdict;

if(scan.verdict==="Safe")
verdictCell.className="safe";

if(scan.verdict==="Suspicious")
verdictCell.className="suspicious";

if(scan.verdict==="High Risk")
verdictCell.className="highrisk";


row.appendChild(urlCell);
row.appendChild(verdictCell);

table.appendChild(row);

});

});


/* Fetch Analytics */

fetch("http://localhost:5000/api/dashboard/analytics")

.then(res=>res.json())

.then(data=>{

const ctx=document.getElementById("riskChart");

new Chart(ctx,{

type:"pie",

data:{

labels:["Safe","Suspicious","High Risk"],

datasets:[{

data:[
data.riskDistribution.safe,
data.riskDistribution.suspicious,
data.riskDistribution.highRisk
],

backgroundColor:[
"#7fb77e",
"#e6a157",
"#c08081"
]

}]

}

});

});Z

</script>

</body>

</html>
